name: Deploy to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment to EC2..."
            cd /opt/mastergroup-ml
            
            # Get current commit for backup reference
            CURRENT_COMMIT=$(git rev-parse --short HEAD)
            echo "Current: $CURRENT_COMMIT"
            
            # Force pull latest code from dev
            git fetch origin dev
            git reset --hard origin/dev
            
            NEW_COMMIT=$(git rev-parse --short HEAD)
            echo "Updated to: $NEW_COMMIT"
            
            # Restart the service
            sudo systemctl restart mastergroup-api
            
            # Wait for service to start
            sleep 5
            
            # Check if service is running
            if systemctl is-active --quiet mastergroup-api; then
              echo "✅ Service is running"
              # Verify health endpoint
              curl -s http://localhost:8001/health | head -c 100
            else
              echo "❌ Service failed to start"
              sudo journalctl -u mastergroup-api -n 20 --no-pager
              exit 1
            fi
            
            echo ""
            echo "✅ Deployment successful! ($CURRENT_COMMIT → $NEW_COMMIT)"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above."
